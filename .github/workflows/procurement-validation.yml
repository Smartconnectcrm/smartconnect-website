name: Procurement Validation

on:
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'src/**'
      - 'scripts/validate-procurement.ts'
      - '.github/workflows/procurement-validation.yml'
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  validate:
    name: Validate Procurement Compliance
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Install tsx
        run: npm install -g tsx
      
      - name: Run procurement validation
        id: validation
        run: |
          tsx scripts/validate-procurement.ts
        continue-on-error: true
      
      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: procurement-validation-report
          path: PROCUREMENT_VALIDATION_REPORT.md
          retention-days: 30
      
      - name: Comment PR with validation results
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const reportPath = 'PROCUREMENT_VALIDATION_REPORT.md';
            
            if (!fs.existsSync(reportPath)) {
              console.log('Report file not found');
              return;
            }
            
            const report = fs.readFileSync(reportPath, 'utf8');
            const truncatedReport = report.length > 65000 
              ? report.substring(0, 65000) + '\n\n... (truncated)'
              : report;
            
            const comment = `## 🔍 Procurement Validation Report
            
            ${truncatedReport}
            
            ---
            *This validation ensures the website maintains procurement-friendly, compliance-oriented content appropriate for public sector and EU tender contexts.*
            `;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
      
      - name: Fail if validation failed
        if: steps.validation.outcome == 'failure'
        run: |
          echo "❌ Procurement validation failed. Please review the report and fix the issues."
          exit 1
      
      - name: Success message
        if: steps.validation.outcome == 'success'
        run: |
          echo "✅ Procurement validation passed successfully!"
